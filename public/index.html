<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Services Status & Performance Hub</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); text-align: center; }
        .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(34, 197, 94, 0.15); color: #4ade80; padding: 4px 12px; border-radius: 9999px; font-size: 14px; font-weight: 600; margin-bottom: 20px; }
        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
        h1 { font-size: 22px; font-weight: 700; margin: 0 0 12px; color: #fff; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
        .stats { display: flex; justify-content: space-around; border-top: 1px solid #334155; padding-top: 20px; }
        .stat-val { font-size: 18px; font-weight: 700; color: #38bdf8; }
        .stat-lbl { font-size: 12px; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge"><span class="dot"></span> All Systems Operational</div>
        <h1>Edge Performance Gateway</h1>
        <p>Real-time distributed network telemetry and API stream relay service.</p>
        <div class="stats">
            <div><div class="stat-val">99.99%</div><div class="stat-lbl">Uptime</div></div>
            <div><div class="stat-val">&lt; 15ms</div><div class="stat-lbl">Latency</div></div>
            <div><div class="stat-val">TLS 1.3</div><div class="stat-lbl">Security</div></div>
        </div>
    </div>
</body>
</html>
